<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <!-- =================== Identidade =================== -->

  <title>Nexus | Serviços e negócios perto de você</title>

  <meta
    name="description"
    content="Descubra serviços, profissionais, produtos e negócios da sua região. Compare opções e agende diretamente pela Nexus."
  >

  <meta
    name="robots"
    content="index, follow, max-image-preview:large"
  >

  <meta name="author" content="Peter Tecnet">
  <meta name="application-name" content="Nexus">
  <meta name="theme-color" content="#07251b">

  <link
    rel="canonical"
    href="https://nexus.petertecnet.com.br/"
  >

  <!-- =================== Favicons =================== -->

  <link
    rel="icon"
    href="%PUBLIC_URL%/favicon.ico"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="32x32"
    href="%PUBLIC_URL%/images/logo.png"
  >

  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="%PUBLIC_URL%/images/logo.png"
  >

  <!-- =================== Aplicativo móvel =================== -->

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Nexus"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <!-- =================== Open Graph =================== -->

  <meta
    property="og:locale"
    content="pt_BR"
  >

  <meta
    property="og:type"
    content="website"
  >

  <meta
    property="og:site_name"
    content="Nexus"
  >

  <meta
    property="og:title"
    content="Nexus — Tudo o que você precisa, mais perto de você"
  >

  <meta
    property="og:description"
    content="Encontre as melhores opções da sua região e conecte-se diretamente com profissionais e negócios que podem atender você."
  >

  <meta
    property="og:url"
    content="https://nexus.petertecnet.com.br/"
  >

  <meta
    property="og:image"
    content="https://nexus.petertecnet.com.br/images/nexus-social.png"
  >

  <meta
    property="og:image:secure_url"
    content="https://nexus.petertecnet.com.br/images/nexus-social.png"
  >

  <meta
    property="og:image:type"
    content="image/png"
  >

  <meta
    property="og:image:width"
    content="1200"
  >

  <meta
    property="og:image:height"
    content="630"
  >

  <meta
    property="og:image:alt"
    content="Nexus — Tudo o que você precisa, mais perto de você"
  >

  <!-- =================== Twitter / X =================== -->

  <meta
    name="twitter:card"
    content="summary_large_image"
  >

  <meta
    name="twitter:title"
    content="Nexus — Tudo o que você precisa, mais perto de você"
  >

  <meta
    name="twitter:description"
    content="Descubra serviços, profissionais, produtos e negócios da sua região e conecte-se diretamente pela Nexus."
  >

  <meta
    name="twitter:image"
    content="https://nexus.petertecnet.com.br/images/nexus-social.png"
  >

  <meta
    name="twitter:image:alt"
    content="Nexus — Tudo o que você precisa, mais perto de você"
  >

  <!-- =================== Dados estruturados =================== -->

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "@id": "https://nexus.petertecnet.com.br/#organization",
      "name": "Nexus",
      "url": "https://nexus.petertecnet.com.br/",
      "logo": {
        "@type": "ImageObject",
        "url": "https://nexus.petertecnet.com.br/images/logo.png",
        "width": 512,
        "height": 512
      },
      "description": "A Nexus conecta pessoas a serviços, profissionais, produtos e negócios da sua região."
    }
  </script>

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "@id": "https://nexus.petertecnet.com.br/#website",
      "url": "https://nexus.petertecnet.com.br/",
      "name": "Nexus",
      "alternateName": "Nexus Serviços",
      "description": "Descubra serviços, profissionais, produtos e negócios da sua região.",
      "inLanguage": "pt-BR",
      "publisher": {
        "@id": "https://nexus.petertecnet.com.br/#organization"
      }
    }
  </script>

  <!-- =================== CSS externos =================== -->

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  >

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
  >

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  >
</head>

<body>
  <noscript>
    Você precisa habilitar o JavaScript para utilizar a Nexus.
  </noscript>

  <!-- =================== Aplicação React =================== -->

  <div id="root"></div>

  <!-- =================== JavaScript externo =================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  ></script>
</body>

</html>
