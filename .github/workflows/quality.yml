name: Nexus Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "audit/**"]

permissions:
  contents: write

concurrency:
  group: nexus-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Synchronize dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit synchronized lock
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(lock): synchronize security dependency changes"
            git push origin HEAD:main
          fi

      - name: Install locked dependencies
        run: npm ci --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit Nexus CSS palette
        run: node scripts/audit-nexus-css.js

      - name: Audit entity image fallbacks
        run: node scripts/audit-entity-image-fallbacks.js

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm test
        env:
          CI: true

      - name: Production build
        run: npm run build
        env:
          CI: true
          REACT_APP_API_BASE_URL: https://api.petertecnet.com.br/api
          REACT_APP_STORAGE_URL: https://api.petertecnet.com.br/storage
          REACT_APP_PUBLIC_URL: https://nexus.petertecnet.com.br
          REACT_APP_ID: 2
          REACT_APP_GOOGLE_CLIENT_ID: test.apps.googleusercontent.com

      - name: Verify build artifacts
        run: |
          test -s build/index.html
          test -d build/static/js
          test -d build/static/css

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Production E2E smoke tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nexus-playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
