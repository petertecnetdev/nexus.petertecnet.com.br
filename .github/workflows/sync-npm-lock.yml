name: Sync npm lockfile

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync-npm-lock.yml

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit synchronized lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi

          git config user.name "Peter Tecnet Automation"
          git config user.email "petertecnet@gmail.com"
          git add package-lock.json
          git commit -m "chore: sync npm lockfile"
          git push origin HEAD:main
