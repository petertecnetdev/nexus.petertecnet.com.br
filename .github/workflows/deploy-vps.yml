name: Deploy VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    # Zero-downtime central deploy: build off-path, publish assets first, switch index last.
    uses: petertecnetdev/petertecnet.com.br/.github/workflows/reusable-vps-deploy.yml@main
    with:
      deploy_path: /var/www/nexus.petertecnet.com.br
      deploy_type: frontend
      deploy_branch: main
      health_url: https://nexus.petertecnet.com.br/
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

  smoke-catalog:
    name: Production public experience smoke test
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Verify Nexus production from VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail

          fetch() {
            local label="$1"
            local url="$2"
            local output
            output="$(mktemp)"
            local status

            if ! status="$(curl --silent --show-error --location \
              --connect-timeout 8 --max-time 25 \
              --retry 2 --retry-delay 2 --retry-connrefused \
              --output "$output" --write-out '%{http_code}' "$url")"; then
              echo "${label}: transport failure accessing ${url}" >&2
              rm -f "$output"
              return 28
            fi

            if [[ "$status" -lt 200 || "$status" -ge 400 ]]; then
              echo "${label}: HTTP ${status} from ${url}" >&2
              head -c 1200 "$output" >&2 || true
              rm -f "$output"
              return 22
            fi

            cat "$output"
            rm -f "$output"
          }

          command -v curl >/dev/null
          command -v jq >/dev/null

          fetch 'Nexus frontend' 'https://nexus.petertecnet.com.br/' >/dev/null

          DISCOVERY_URL='https://api.petertecnet.com.br/api/v1/apps/nexus/discovery?limit=10'
          DISCOVERY_JSON="$(fetch 'Nexus discovery' "$DISCOVERY_URL")"

          echo "$DISCOVERY_JSON" | jq -e '.success == true' >/dev/null
          echo "$DISCOVERY_JSON" | jq -e '.establishments | type == "array" and length > 0' >/dev/null

          SLUG="$(echo "$DISCOVERY_JSON" | jq -r '.establishments[0].slug // empty')"
          if [[ -z "$SLUG" ]]; then
            echo 'Discovery returned an establishment without slug.' >&2
            exit 1
          fi

          CATALOG_URL="https://api.petertecnet.com.br/api/v1/apps/nexus/catalog/${SLUG}"
          CATALOG_JSON="$(fetch 'Nexus catalog API' "$CATALOG_URL")"

          echo "$CATALOG_JSON" | jq -e '.success == true' >/dev/null
          echo "$CATALOG_JSON" | jq -e '.data.establishment.slug == $slug' --arg slug "$SLUG" >/dev/null
          echo "$CATALOG_JSON" | jq -e '.data.items | type == "array"' >/dev/null
          echo "$CATALOG_JSON" | jq -e '.availability.status == "public" and .availability.indexable == true' >/dev/null

          fetch 'Nexus company page' "https://nexus.petertecnet.com.br/establishment/view/${SLUG}" >/dev/null
          fetch 'Nexus catalog page' "https://nexus.petertecnet.com.br/catalog/${SLUG}" >/dev/null

          echo "Production smoke test passed for discovery, company presentation and catalog: $SLUG"
          REMOTE
