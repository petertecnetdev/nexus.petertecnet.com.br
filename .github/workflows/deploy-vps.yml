name: Deploy VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    # Zero-downtime central deploy: build off-path, publish assets first, switch index last.
    uses: petertecnetdev/petertecnet.com.br/.github/workflows/reusable-vps-deploy.yml@main
    with:
      deploy_path: /var/www/nexus.petertecnet.com.br
      deploy_type: frontend
      deploy_branch: main
      health_url: https://nexus.petertecnet.com.br/
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

  smoke-catalog:
    name: Production public experience smoke test
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose production transport
        shell: bash
        run: |
          set -euo pipefail

          diagnose_host() {
            local host="$1"
            echo "--- DNS: ${host} ---"
            getent ahostsv4 "$host" || true
            echo "--- HTTPS: ${host} ---"
            if ! curl --silent --show-error --location \
              --connect-timeout 8 --max-time 20 \
              --retry 2 --retry-delay 2 --retry-connrefused \
              --output /dev/null --write-out 'status=%{http_code} remote=%{remote_ip} connect=%{time_connect}s tls=%{time_appconnect}s total=%{time_total}s\n' \
              "https://${host}/"; then
              echo "::error title=Production transport unavailable::Não foi possível estabelecer conexão HTTPS com ${host}. A falha é de DNS/rede/TLS/disponibilidade e ocorreu antes dos testes funcionais."
              return 28
            fi
          }

          diagnose_host "api.petertecnet.com.br"
          diagnose_host "nexus.petertecnet.com.br"

      - name: Verify Nexus discovery, company presentation and catalog
        shell: bash
        run: |
          set -euo pipefail

          fetch() {
            local label="$1"
            local url="$2"
            local output
            output="$(mktemp)"
            local status

            if ! status="$(curl --silent --show-error --location \
              --connect-timeout 8 --max-time 25 \
              --retry 2 --retry-delay 2 --retry-connrefused \
              --output "$output" --write-out '%{http_code}' "$url")"; then
              echo "::error title=${label} transport failure::Falha de transporte ao acessar ${url}." >&2
              rm -f "$output"
              return 28
            fi

            if [[ "$status" -lt 200 || "$status" -ge 400 ]]; then
              echo "::error title=${label} HTTP ${status}::O endpoint respondeu, mas retornou HTTP ${status}: ${url}" >&2
              head -c 1200 "$output" >&2 || true
              rm -f "$output"
              return 22
            fi

            cat "$output"
            rm -f "$output"
          }

          DISCOVERY_URL="https://api.petertecnet.com.br/api/v1/apps/nexus/discovery?limit=10"
          DISCOVERY_JSON="$(fetch 'Nexus discovery' "$DISCOVERY_URL")"

          echo "$DISCOVERY_JSON" | jq -e '.success == true' >/dev/null
          echo "$DISCOVERY_JSON" | jq -e '.establishments | type == "array" and length > 0' >/dev/null

          SLUG="$(echo "$DISCOVERY_JSON" | jq -r '.establishments[0].slug // empty')"
          if [[ -z "$SLUG" ]]; then
            echo "::error title=Invalid discovery payload::Discovery retornou um estabelecimento sem slug."
            exit 1
          fi

          CATALOG_URL="https://api.petertecnet.com.br/api/v1/apps/nexus/catalog/${SLUG}"
          CATALOG_JSON="$(fetch 'Nexus catalog API' "$CATALOG_URL")"

          echo "$CATALOG_JSON" | jq -e '.success == true' >/dev/null
          echo "$CATALOG_JSON" | jq -e '.data.establishment.slug == $slug' --arg slug "$SLUG" >/dev/null
          echo "$CATALOG_JSON" | jq -e '.data.items | type == "array"' >/dev/null
          echo "$CATALOG_JSON" | jq -e '.availability.status == "public" and .availability.indexable == true' >/dev/null

          COMPANY_PAGE="$(fetch 'Nexus company page' "https://nexus.petertecnet.com.br/establishment/view/${SLUG}")"
          test -n "$COMPANY_PAGE"

          CATALOG_PAGE="$(fetch 'Nexus catalog page' "https://nexus.petertecnet.com.br/catalog/${SLUG}")"
          test -n "$CATALOG_PAGE"

          echo "Production smoke test passed for discovery, company presentation and catalog: $SLUG"
