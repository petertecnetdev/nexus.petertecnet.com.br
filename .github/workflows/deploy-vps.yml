name: Deploy VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capacity-recovery:
    name: Recover safe VPS capacity for Nexus
    runs-on: ubuntu-latest
    steps:
      - name: Reclaim regenerable Nexus frontend files when disk is tight
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?VPS_HOST is required}"
          : "${VPS_USER:?VPS_USER is required}"
          : "${VPS_SSH_KEY:?VPS_SSH_KEY is required}"
          PORT="${VPS_PORT:-22}"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          : > "$HOME/.ssh/known_hosts"

          ssh -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=20 -p "$PORT" "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          deploy_path='/var/www/nexus.petertecnet.com.br'
          [[ -d "$deploy_path/.git" ]] || { echo 'Nexus production checkout was not found.' >&2; exit 23; }

          free_kb="$(df -Pk "$deploy_path" | awk 'NR==2 {print $4}')"
          warn_kb=$((5 * 1024 * 1024))
          min_kb=$((3 * 1024 * 1024))
          echo "Nexus VPS free disk before recovery: $((free_kb / 1024)) MiB"

          if (( free_kb < warn_kb )); then
            # Nexus is compiled on the GitHub runner. node_modules on the production
            # checkout is therefore regenerable and is never used to serve the live build.
            if [[ -d "$deploy_path/node_modules" ]]; then
              echo 'Removing regenerable Nexus node_modules from production checkout.'
              rm -rf "$deploy_path/node_modules" 2>/dev/null || sudo -n rm -rf "$deploy_path/node_modules"
            fi

            # Remove only interrupted atomic-release artifacts owned by this frontend.
            find "$deploy_path" -maxdepth 1 -type d \
              \( -name '.build.next.*' -o -name '.build.previous.*' -o -name '.build.failed.*' \
                 -o -name '.dist.next.*' -o -name '.dist.previous.*' -o -name '.dist.failed.*' \) \
              -mmin +60 -print -exec rm -rf {} + 2>/dev/null || true

            # Uploaded release archives are disposable after a run and are namespaced.
            find /tmp -maxdepth 1 -type f -name 'petertecnet-frontend-*.tgz' -mmin +120 -delete 2>/dev/null || true

            # Automation/validation workspaces under /tmp are disposable clones. Reclaim
            # only Nexus-namespaced directories that have been untouched for six hours,
            # so concurrent runs and unrelated applications remain protected.
            find /tmp -maxdepth 1 -type d \
              \( -name 'nexus-*' -o -name 'automation-nexus-*' \) \
              -mmin +360 -print -exec rm -rf {} + 2>/dev/null || true
          fi

          free_kb="$(df -Pk "$deploy_path" | awk 'NR==2 {print $4}')"
          echo "Nexus VPS free disk after recovery: $((free_kb / 1024)) MiB"
          if (( free_kb < min_kb )); then
            echo 'VPS still has less than 3 GiB free after Nexus-safe cleanup.' >&2
            exit 28
          fi
          REMOTE

  deploy:
    needs: capacity-recovery
    # Zero-downtime central deploy: build off-path, publish assets first, switch index last.
    uses: petertecnetdev/petertecnet.com.br/.github/workflows/reusable-vps-deploy.yml@main
    with:
      deploy_path: /var/www/nexus.petertecnet.com.br
      deploy_type: frontend
      deploy_branch: main
      health_url: https://nexus.petertecnet.com.br/
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

  smoke-catalog:
    name: Production public experience smoke test
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?VPS_HOST is required}"
          : "${VPS_SSH_KEY:?VPS_SSH_KEY is required}"
          PORT="${VPS_PORT:-22}"
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          : > ~/.ssh/known_hosts

          # ssh-keyscan can fail transiently while the VPS is restarting or the
          # network path is converging. Retry before classifying production as broken.
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 10 -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && [[ -s ~/.ssh/known_hosts ]]; then
              break
            fi
            if [[ "$attempt" -eq 5 ]]; then
              echo "Unable to obtain VPS SSH host key after ${attempt} attempts." >&2
              exit 1
            fi
            sleep $((attempt * 2))
          done

      - name: Verify Nexus production from VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=15 -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail

          fetch() {
            local label="$1"
            local url="$2"
            local output
            output="$(mktemp)"
            local status

            if ! status="$(curl --silent --show-error --location \
              --connect-timeout 8 --max-time 25 \
              --retry 2 --retry-delay 2 --retry-connrefused \
              --output "$output" --write-out '%{http_code}' "$url")"; then
              echo "${label}: transport failure accessing ${url}" >&2
              rm -f "$output"
              return 28
            fi

            if [[ "$status" -lt 200 || "$status" -ge 400 ]]; then
              echo "${label}: HTTP ${status} from ${url}" >&2
              head -c 1200 "$output" >&2 || true
              rm -f "$output"
              return 22
            fi

            cat "$output"
            rm -f "$output"
          }

          require_json() {
            local label="$1"
            local expression="$2"
            local payload="$3"
            if ! echo "$payload" | jq -e "$expression" >/dev/null; then
              echo "${label}: assertion failed (${expression})" >&2
              echo "$payload" | jq -c '{success, keys: (keys), data_type: ((.data // null) | type), data_keys: ((.data // {}) | if type == "object" then keys else [] end)}' >&2 || head -c 1200 <<<"$payload" >&2
              return 1
            fi
          }

          command -v curl >/dev/null
          command -v jq >/dev/null

          fetch 'Nexus frontend' 'https://nexus.petertecnet.com.br/' >/dev/null

          DISCOVERY_URL='https://api.petertecnet.com.br/api/v1/apps/nexus/discovery?limit=10'
          DISCOVERY_JSON="$(fetch 'Nexus discovery' "$DISCOVERY_URL")"

          require_json 'Nexus discovery success' '.success == true' "$DISCOVERY_JSON"
          require_json 'Nexus discovery establishments' '(.establishments // .data.establishments // .data // []) | type == "array" and length > 0' "$DISCOVERY_JSON"

          SLUG="$(echo "$DISCOVERY_JSON" | jq -r '((.establishments // .data.establishments // .data // [])[0].slug) // empty')"
          if [[ -z "$SLUG" ]]; then
            echo 'Discovery returned an establishment without slug.' >&2
            echo "$DISCOVERY_JSON" | jq -c '{success, keys: keys, data_keys: ((.data // {}) | if type == "object" then keys else [] end)}' >&2 || true
            exit 1
          fi

          CATALOG_URL="https://api.petertecnet.com.br/api/v1/apps/nexus/catalog/${SLUG}"
          CATALOG_JSON="$(fetch 'Nexus catalog API' "$CATALOG_URL")"

          require_json 'Nexus catalog success' '.success == true' "$CATALOG_JSON"
          if ! echo "$CATALOG_JSON" | jq -e '(.data.establishment.slug // .establishment.slug) == $slug' --arg slug "$SLUG" >/dev/null; then
            echo "Nexus catalog establishment mismatch for ${SLUG}." >&2
            echo "$CATALOG_JSON" | jq -c '{success, keys: keys, data_keys: ((.data // {}) | if type == "object" then keys else [] end)}' >&2 || true
            exit 1
          fi
          require_json 'Nexus catalog items' '(.data.items // .items // []) | type == "array"' "$CATALOG_JSON"

          AVAILABILITY_STATUS="$(echo "$CATALOG_JSON" | jq -r '.availability.status // .data.availability.status // empty')"
          INDEXABLE="$(echo "$CATALOG_JSON" | jq -r '.availability.indexable // .data.availability.indexable // empty')"
          if [[ -n "$AVAILABILITY_STATUS" && "$AVAILABILITY_STATUS" != "public" ]]; then
            echo "Catalog ${SLUG} is not public: ${AVAILABILITY_STATUS}" >&2
            exit 1
          fi
          if [[ -n "$INDEXABLE" && "$INDEXABLE" != "true" ]]; then
            echo "Catalog ${SLUG} is not indexable." >&2
            exit 1
          fi

          fetch 'Nexus company page' "https://nexus.petertecnet.com.br/establishment/view/${SLUG}" >/dev/null
          fetch 'Nexus catalog page' "https://nexus.petertecnet.com.br/catalog/${SLUG}" >/dev/null

          echo "Production smoke test passed for discovery, company presentation and catalog: $SLUG"
          REMOTE
