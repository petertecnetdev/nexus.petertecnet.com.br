name: Nexus Android

on:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci --no-fund
      - run: npm run build
        env:
          CI: true
          REACT_APP_API_BASE_URL: https://api.petertecnet.com.br/api
          REACT_APP_STORAGE_URL: https://api.petertecnet.com.br/storage
          REACT_APP_PUBLIC_URL: https://nexus.petertecnet.com.br
          REACT_APP_ID: 2
          REACT_APP_GOOGLE_CLIENT_ID: test.apps.googleusercontent.com
      - run: npx cap sync android
      - name: Run Android tests and release build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew test assembleRelease --stacktrace
