apply plugin: 'com.android.application'

android {
    namespace "com.petertecnet.nexus"
    compileSdkVersion 35

    defaultConfig {
        applicationId "com.petertecnet.nexus"
        minSdkVersion 23
        targetSdkVersion 35
        versionCode 1
        versionName "1.0.0"
    }

    def releaseStoreFile = System.getenv("NEXUS_RELEASE_STORE_FILE")
    def releaseStorePassword = System.getenv("NEXUS_RELEASE_STORE_PASSWORD")
    def releaseKeyAlias = System.getenv("NEXUS_RELEASE_KEY_ALIAS")
    def releaseKeyPassword = System.getenv("NEXUS_RELEASE_KEY_PASSWORD")
    def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
}

// Capacitor generates this file during `npx cap sync android`; keeping the
// apply here is required so the app receives Capacitor's Java compatibility,
// Cordova variables and plugin dependencies.
apply from: 'capacitor.build.gradle'
