android.useAndroidX=true
android.enableJetifier=true

# The default Gradle daemon heap (512 MiB) is insufficient for the release
# R8 + Android lint pipeline on CI. Keep enough headroom for production builds
# without depending on runner-specific defaults.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Release signing credentials must never be committed.
# Provide these only through CI/VPS environment variables:
# NEXUS_RELEASE_STORE_FILE
# NEXUS_RELEASE_STORE_PASSWORD
# NEXUS_RELEASE_KEY_ALIAS
# NEXUS_RELEASE_KEY_PASSWORD
